services:
  firefly-iii-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: firefly-iii-assistant
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      FIREFLY_BASE_URL: "${FIREFLY_BASE_URL:-}"
      FIREFLY_ACCESS_TOKEN: "${FIREFLY_ACCESS_TOKEN:-}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-gemma3:4b}"
      OLLAMA_TIMEOUT_MS: "${OLLAMA_TIMEOUT_MS:-120000}"
      AUTH_SECRET: "${AUTH_SECRET:-}"
      AUTH_TRUST_HOST: "${AUTH_TRUST_HOST:-true}"
      AUTH_URL: "${AUTH_URL:-}"
      OIDC_ISSUER: "${OIDC_ISSUER:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      OIDC_PROVIDER_NAME: "${OIDC_PROVIDER_NAME:-Single Sign-On}"
      OIDC_GROUPS_CLAIM: "${OIDC_GROUPS_CLAIM:-groups}"
      OIDC_REQUIRED_GROUP: "${OIDC_REQUIRED_GROUP:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
