<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Firefly III Kategoriserare</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f4f6f9; color: #222; }
    header {
      background: #1a2340; color: #fff; padding: 12px 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    header h1 { font-size: 1.1rem; font-weight: 600; }
    #user-badge { font-size: 0.8rem; opacity: 0.75; }
    nav { background: #fff; border-bottom: 1px solid #dde; display: flex; padding: 0 24px; }
    nav button {
      background: none; border: none; padding: 14px 20px; cursor: pointer;
      font-size: 0.9rem; color: #555; border-bottom: 3px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }
    nav button.active { color: #1a2340; border-bottom-color: #1a2340; font-weight: 600; }
    main { max-width: 960px; margin: 24px auto; padding: 0 16px; }
    .tab { display: none; }
    .tab.active { display: block; }

    /* Status bar */
    #status {
      padding: 10px 16px; border-radius: 6px; margin-bottom: 16px;
      font-size: 0.875rem; background: #e8f0fe; color: #1a2340;
    }
    #status.error { background: #fdecea; color: #c0392b; }
    #status.ok { background: #e6f9f0; color: #1a7a4a; }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 14px; border-radius: 6px; border: none; cursor: pointer;
      font-size: 0.85rem; font-weight: 500; transition: opacity 0.15s;
    }
    .btn:disabled { opacity: 0.45; cursor: default; }
    .btn-primary { background: #1a2340; color: #fff; }
    .btn-secondary { background: #e2e8f0; color: #333; }
    .btn-danger { background: #e53e3e; color: #fff; }
    .btn-sm { padding: 4px 10px; font-size: 0.78rem; }

    /* Cards */
    .card {
      background: #fff; border-radius: 8px; border: 1px solid #dde;
      padding: 16px; margin-bottom: 12px;
    }
    .card-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 12px; margin-bottom: 10px;
    }
    .card-title { font-weight: 600; font-size: 0.95rem; }
    .card-meta { font-size: 0.78rem; color: #888; margin-top: 2px; }
    .card-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-start; }
    .card-body { display: flex; gap: 12px; flex-wrap: wrap; }

    /* Suggestion chips */
    .chip {
      font-size: 0.75rem; background: #eef2ff; color: #3730a3;
      border-radius: 12px; padding: 2px 10px; display: inline-block;
    }
    .chip.local { background: #f0fdf4; color: #166534; }
    .chip.cloud { background: #eff6ff; color: #1d4ed8; }
    .chip.manual { background: #fef9c3; color: #854d0e; }
    .chip.none { background: #f3f4f6; color: #6b7280; }

    /* Form selects */
    select {
      padding: 5px 8px; border: 1px solid #ccd; border-radius: 5px;
      font-size: 0.82rem; background: #fff; cursor: pointer; min-width: 130px;
    }

    /* Confidence badges */
    .badge {
      display: inline-block; border-radius: 12px; padding: 2px 10px;
      font-size: 0.72rem; font-weight: 600; letter-spacing: 0.02em;
    }
    .badge-high { background: #fde8e8; color: #c0392b; }
    .badge-medium { background: #fef3cd; color: #856404; }
    .badge-low { background: #e2e8f0; color: #4a5568; }

    /* Duplicates layout */
    .dup-pair { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
    .dup-txn {
      flex: 1; min-width: 200px; background: #f9fafb; border-radius: 6px;
      border: 1px solid #e2e8f0; padding: 10px;
    }
    .dup-txn.keep { border-color: #68d391; background: #f0fff4; }
    .dup-txn.remove { border-color: #fc8181; background: #fff5f5; }
    .dup-txn-label { font-size: 0.7rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.05em; color: #888; margin-bottom: 4px; }

    /* Rules list */
    .rule-row { display: flex; align-items: center; gap: 10px; padding: 8px 0;
      border-bottom: 1px solid #f0f0f0; font-size: 0.85rem; }
    .rule-row:last-child { border-bottom: none; }
    .rule-active { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .rule-active.on { background: #48bb78; }
    .rule-active.off { background: #cbd5e0; }

    /* Toolbar */
    .toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
    .toolbar select { min-width: 160px; }

    /* Progress text */
    .progress-text { font-size: 0.8rem; color: #666; }

    /* Empty state */
    .empty { text-align: center; padding: 48px 0; color: #aaa; font-size: 0.9rem; }

    /* Spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor;
      border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite;
    }
  </style>
</head>
<body>

<header>
  <h1>Firefly III Kategoriserare</h1>
  <span id="user-badge">Laddar...</span>
</header>

<nav>
  <button class="active" onclick="showTab('tab-cat', this)">Kategorisera</button>
  <button onclick="showTab('tab-dup', this)">Dubbletter</button>
  <button onclick="showTab('tab-rules', this)">Regler</button>
</nav>

<main>
  <div id="status">Ansluter till Firefly III…</div>

  <!-- ── KATEGORISERA ────────────────────────────────────────── -->
  <div id="tab-cat" class="tab active">
    <div class="toolbar">
      <button class="btn btn-primary" id="btn-load" onclick="loadTransactions()">
        Hämta transaktioner
      </button>
      <button class="btn btn-secondary" id="btn-save" onclick="saveAll()" disabled>
        Spara alla
      </button>
      <select id="mode-select">
        <option value="uncategorized">Okategoriserade</option>
        <option value="all">Alla</option>
      </select>
      <span class="progress-text" id="progress-text"></span>
    </div>
    <div id="txn-list"></div>
  </div>

  <!-- ── DUBBLETTER ─────────────────────────────────────────── -->
  <div id="tab-dup" class="tab">
    <div class="toolbar">
      <button class="btn btn-primary" onclick="loadDuplicates()">
        Sök dubbletter
      </button>
      <select id="dup-days">
        <option value="30">Senaste 30 dagarna</option>
        <option value="60">Senaste 60 dagarna</option>
        <option value="90">Senaste 90 dagarna</option>
      </select>
    </div>
    <div id="dup-list"></div>
  </div>

  <!-- ── REGLER ─────────────────────────────────────────────── -->
  <div id="tab-rules" class="tab">
    <div class="toolbar">
      <button class="btn btn-primary" onclick="loadRules()">Uppdatera regler</button>
      <button class="btn btn-secondary" id="btn-create-rules" onclick="createRules()" disabled>
        Skapa regler för sparade
      </button>
    </div>
    <div id="rules-list"></div>
  </div>
</main>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
const state = {
  categories: [],
  budgets: [],
  pending: {},    // group_id → {category_name, budget_name, destination_name}
  done: new Set() // group_ids that have been saved
};

// ── Boot ──────────────────────────────────────────────────────────────────────
async function boot() {
  // Fetch user identity (injected by Authelia via Traefik forwardAuth)
  try {
    const me = await apiFetch('/api/me');
    document.getElementById('user-badge').textContent =
      me.name || me.user || 'Inloggad';
  } catch {
    document.getElementById('user-badge').textContent = 'Inte inloggad';
  }

  // Initialise backend (connect to Firefly III, build history index)
  setStatus('Ansluter och hämtar historik…');
  try {
    const info = await apiFetch('/api/init', {method: 'POST'});
    setStatus(
      `Klar. ${info.categories} kategorier, ${info.budgets} budgetar, ` +
      `${info.history} historiska transaktioner. AI: ${info.ai_backend}.`,
      'ok'
    );
  } catch (e) {
    setStatus('Anslutningsfel: ' + e.message, 'error');
    return;
  }

  // Load metadata for dropdowns
  try {
    const meta = await apiFetch('/api/metadata');
    state.categories = meta.categories || [];
    state.budgets    = meta.budgets    || [];
  } catch {}
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function setStatus(msg, cls = '') {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = cls;
}

async function apiFetch(url, opts = {}) {
  const r = await fetch(url, {
    headers: {'Content-Type': 'application/json', ...(opts.headers || {})},
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (!r.ok) {
    const j = await r.json().catch(() => ({}));
    throw new Error(j.detail || `HTTP ${r.status}`);
  }
  return r.json();
}

function showTab(id, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
}

function categoryOptions(selected) {
  const blank = `<option value="">— ingen —</option>`;
  return blank + state.categories.map(c =>
    `<option value="${esc(c.name)}" ${c.name === selected ? 'selected' : ''}>${esc(c.name)}</option>`
  ).join('');
}

function budgetOptions(selected) {
  const blank = `<option value="">— ingen —</option>`;
  return blank + state.budgets.map(b =>
    `<option value="${esc(b.name)}" ${b.name === selected ? 'selected' : ''}>${esc(b.name)}</option>`
  ).join('');
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function chipClass(source) {
  return {history: 'local', ai_local: 'local', ai_cloud: 'cloud', manual: 'manual'}[source] ?? 'none';
}

function sourceLabel(source) {
  return {history: 'Historik', ai_local: 'AI lokal', ai_cloud: 'AI moln',
          manual: 'Manuell', none: 'Inget'}[source] ?? source;
}

function updateProgress() {
  const total = Object.keys(state.pending).length;
  const done  = state.done.size;
  const el = document.getElementById('progress-text');
  el.textContent = total ? `${done} sparade av ${total + done} totalt` : '';
  document.getElementById('btn-save').disabled = total === 0;
  document.getElementById('btn-create-rules').disabled = state.done.size === 0;
}

// ── Tab: Kategorisera ─────────────────────────────────────────────────────────
async function loadTransactions() {
  const btn  = document.getElementById('btn-load');
  const mode = document.getElementById('mode-select').value;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Hämtar…';
  setStatus('Hämtar transaktioner…');
  try {
    const items = await apiFetch(`/api/transactions?mode=${mode}&limit=50`);
    state.pending = {};
    state.done.clear();
    renderTransactions(items);
    setStatus(`${items.length} transaktioner hämtade.`, 'ok');
  } catch (e) {
    setStatus('Fel: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Hämta transaktioner';
  }
}

function renderTransactions(items) {
  const list = document.getElementById('txn-list');
  if (!items.length) {
    list.innerHTML = '<div class="empty">Inga transaktioner hittades.</div>';
    updateProgress();
    return;
  }

  // Pre-populate pending state from suggestions
  items.forEach(({transaction: t, suggestion: s}) => {
    state.pending[t.group_id] = {
      category_name:   s.category_name   || t.category_name   || '',
      budget_name:     s.budget_name     || t.budget_name     || '',
      destination_name: s.destination_name || t.destination_name || '',
    };
  });

  list.innerHTML = items.map(({transaction: t, suggestion: s}) => {
    const p = state.pending[t.group_id];
    const src = chipClass(s.source || 'none');
    const amount = Number(t.amount).toLocaleString('sv-SE', {minimumFractionDigits: 2}) + ' ' + (t.currency_code || 'kr');
    const date   = (t.date || '').slice(0, 10);
    return `
    <div class="card" id="card-${t.group_id}">
      <div class="card-header">
        <div>
          <div class="card-title">${esc(t.description)}</div>
          <div class="card-meta">${esc(t.source_name)} → ${esc(t.destination_name)} &nbsp;·&nbsp; ${amount} &nbsp;·&nbsp; ${date}</div>
          ${s.reasoning ? `<div class="card-meta" style="margin-top:4px;font-style:italic">${esc(s.reasoning)}</div>` : ''}
        </div>
        <div style="display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap">
          <span class="chip ${src}">${sourceLabel(s.source)}</span>
          ${s.confidence ? `<span class="chip none">${Math.round(s.confidence * 100)}%</span>` : ''}
        </div>
      </div>
      <div class="card-body">
        <label style="display:flex;flex-direction:column;gap:3px;font-size:0.78rem">
          Kategori
          <select onchange="updatePending('${t.group_id}','category_name',this.value)">
            ${categoryOptions(p.category_name)}
          </select>
        </label>
        <label style="display:flex;flex-direction:column;gap:3px;font-size:0.78rem">
          Budget
          <select onchange="updatePending('${t.group_id}','budget_name',this.value)">
            ${budgetOptions(p.budget_name)}
          </select>
        </label>
        <label style="display:flex;flex-direction:column;gap:3px;font-size:0.78rem">
          Leverantör
          <input type="text" value="${esc(p.destination_name)}"
            oninput="updatePending('${t.group_id}','destination_name',this.value)"
            style="padding:5px 8px;border:1px solid #ccd;border-radius:5px;font-size:0.82rem;width:150px" />
        </label>
      </div>
      <div style="margin-top:10px;display:flex;gap:8px">
        <button class="btn btn-primary btn-sm" onclick="saveSingle('${t.group_id}')">Spara</button>
        <button class="btn btn-secondary btn-sm" onclick="skipSingle('${t.group_id}')">Hoppa över</button>
      </div>
    </div>`;
  }).join('');
  updateProgress();
}

function updatePending(gid, field, value) {
  if (!state.pending[gid]) state.pending[gid] = {};
  state.pending[gid][field] = value;
}

async function saveSingle(gid) {
  const card = document.getElementById('card-' + gid);
  card.style.opacity = '0.5';
  try {
    await apiFetch('/api/transactions/batch-update', {
      method: 'POST',
      body: {updates: [{group_id: gid, ...state.pending[gid]}]},
    });
    delete state.pending[gid];
    state.done.add(gid);
    card.remove();
    updateProgress();
  } catch (e) {
    card.style.opacity = '1';
    setStatus('Fel vid sparning: ' + e.message, 'error');
  }
}

function skipSingle(gid) {
  delete state.pending[gid];
  document.getElementById('card-' + gid)?.remove();
  updateProgress();
}

async function saveAll() {
  const btn = document.getElementById('btn-save');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Sparar…';
  const updates = Object.entries(state.pending).map(([gid, p]) => ({group_id: gid, ...p}));
  try {
    const results = await apiFetch('/api/transactions/batch-update', {
      method: 'POST', body: {updates},
    });
    const ok = results.filter(r => r.ok).map(r => r.group_id);
    ok.forEach(gid => {
      delete state.pending[gid];
      state.done.add(gid);
      document.getElementById('card-' + gid)?.remove();
    });
    const failed = results.filter(r => !r.ok);
    if (failed.length) {
      setStatus(`${ok.length} sparade, ${failed.length} misslyckades.`, 'error');
    } else {
      setStatus(`${ok.length} transaktioner sparade.`, 'ok');
    }
  } catch (e) {
    setStatus('Fel: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Spara alla';
    updateProgress();
  }
}

// ── Tab: Dubbletter ───────────────────────────────────────────────────────────
async function loadDuplicates() {
  const days = document.getElementById('dup-days').value;
  setStatus('Söker efter dubbletter…');
  const list = document.getElementById('dup-list');
  list.innerHTML = '<div class="empty"><span class="spinner"></span></div>';
  try {
    const groups = await apiFetch(`/api/duplicates?days=${days}`);
    renderDuplicates(groups);
    setStatus(`${groups.length} möjliga dubblettpar hittade.`, groups.length ? '' : 'ok');
  } catch (e) {
    setStatus('Fel: ' + e.message, 'error');
    list.innerHTML = '';
  }
}

function renderDuplicates(groups) {
  const list = document.getElementById('dup-list');
  if (!groups.length) {
    list.innerHTML = '<div class="empty">Inga dubbletter hittade.</div>';
    return;
  }
  list.innerHTML = groups.map((g, i) => {
    const [a, b] = g.transactions;
    const badgeClass = {high: 'badge-high', medium: 'badge-medium', low: 'badge-low'}[g.confidence];
    const confLabel  = {high: 'Hög', medium: 'Medel', low: 'Låg'}[g.confidence];
    return `
    <div class="card" id="dup-${i}">
      <div class="card-header">
        <div>
          <div class="card-title">${esc(a.description)}</div>
          <div class="card-meta">${g.delta_days} dagars skillnad &nbsp;·&nbsp; ${Number(a.amount).toLocaleString('sv-SE',{minimumFractionDigits:2})} ${a.currency_code||'kr'}</div>
        </div>
        <span class="badge ${badgeClass}">${confLabel} sannolikhet</span>
      </div>
      <div class="dup-pair">
        ${dupCard(a, 'Behåll')}
        ${dupCard(b, 'Möjlig dubblett')}
      </div>
      <div style="margin-top:12px;display:flex;gap:8px">
        <button class="btn btn-danger btn-sm"
          onclick="resolveDup('${a.group_id}','${b.group_id}','dup-${i}')">
          Ta bort transaktionen till höger
        </button>
        <button class="btn btn-danger btn-sm"
          onclick="resolveDup('${b.group_id}','${a.group_id}','dup-${i}')">
          Ta bort transaktionen till vänster
        </button>
        <button class="btn btn-secondary btn-sm" onclick="document.getElementById('dup-${i}').remove()">
          Hoppa över
        </button>
      </div>
    </div>`;
  }).join('');
}

function dupCard(t, label) {
  return `
  <div class="dup-txn">
    <div class="dup-txn-label">${label}</div>
    <div style="font-weight:600;font-size:0.88rem">${esc(t.description)}</div>
    <div style="font-size:0.78rem;color:#666;margin-top:3px">
      ${(t.date||'').slice(0,10)} &nbsp;·&nbsp;
      ${Number(t.amount).toLocaleString('sv-SE',{minimumFractionDigits:2})} ${t.currency_code||'kr'}
    </div>
    ${t.category_name ? `<div style="font-size:0.75rem;color:#555;margin-top:3px">📂 ${esc(t.category_name)}</div>` : ''}
  </div>`;
}

async function resolveDup(keepId, deleteId, cardId) {
  const card = document.getElementById(cardId);
  card.style.opacity = '0.5';
  try {
    await apiFetch('/api/duplicates/resolve', {
      method: 'POST',
      body: {keep_group_id: keepId, delete_group_id: deleteId},
    });
    card.remove();
    setStatus('Dubblett borttagen.', 'ok');
  } catch (e) {
    card.style.opacity = '1';
    setStatus('Fel: ' + e.message, 'error');
  }
}

// ── Tab: Regler ───────────────────────────────────────────────────────────────
async function loadRules() {
  setStatus('Hämtar regler…');
  const list = document.getElementById('rules-list');
  list.innerHTML = '<div class="empty"><span class="spinner"></span></div>';
  try {
    const rules = await apiFetch('/api/rules');
    renderRules(rules);
    setStatus(`${rules.length} regler hämtade.`, 'ok');
  } catch (e) {
    setStatus('Fel: ' + e.message, 'error');
    list.innerHTML = '';
  }
}

function renderRules(rules) {
  const list = document.getElementById('rules-list');
  if (!rules.length) {
    list.innerHTML = '<div class="empty">Inga regler skapade ännu.</div>';
    return;
  }
  list.innerHTML = `<div class="card">${rules.map(r => `
    <div class="rule-row">
      <span class="rule-active ${r.active ? 'on' : 'off'}" title="${r.active ? 'Aktiv' : 'Inaktiv'}"></span>
      <span style="flex:1">${esc(r.title)}</span>
      <span style="font-size:0.75rem;color:#888">${esc(r.trigger)}</span>
    </div>`).join('')}
  </div>`;
}

async function createRules() {
  if (!state.done.size) return;
  const btn = document.getElementById('btn-create-rules');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Skapar…';
  try {
    const res = await apiFetch('/api/rules/create', {
      method: 'POST',
      body: {group_ids: [...state.done]},
    });
    setStatus(
      `${res.created.length} regler skapade, ${res.skipped.length} hoppade över, ${res.errors.length} fel.`,
      res.errors.length ? 'error' : 'ok'
    );
    await loadRules();
  } catch (e) {
    setStatus('Fel: ' + e.message, 'error');
  } finally {
    btn.disabled = state.done.size === 0;
    btn.textContent = 'Skapa regler för sparade';
  }
}

// ── Init ──────────────────────────────────────────────────────────────────────
boot();
</script>
</body>
</html>
